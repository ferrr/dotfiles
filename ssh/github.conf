# Included from ~/.ssh/config (see install). Shared between the Mac and remote boxes.
#
# Only the *public* keys live in dotfiles. On boxes without the private key, ssh
# falls back to <IdentityFile>.pub and asks the forwarded agent to sign with it.

# Work account (rnefyodov)
Host github.com
	User git
	IdentityFile ~/.ssh/id_avride
	IdentitiesOnly yes

# Personal account (rnfd). gitconfig rewrites git@github.com:rnfd/* to this alias.
Host github-personal
	HostName github.com
	User git
	IdentityFile ~/.ssh/id_gh_personal
	IdentitiesOnly yes

# Forward the agent to Coder workspaces so git there can use the keys above.
Host *.avride.ai coder.* coder-vscode--*
	ForwardAgent yes
